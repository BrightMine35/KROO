<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-ROO Radio | Live</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.PNG">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        .tab-container { display: flex; justify-content: center; background: #0033A0; padding: 10px 0; position: sticky; top: 0; z-index: 1000; border-bottom: 2px solid #FFDD00; }
        .tab-link { color: white; padding: 12px 20px; text-decoration: none; font-weight: bold; transition: 0.3s; border-radius: 5px; margin: 0 5px; font-size: 0.9em; }
        .tab-link:hover { background: rgba(255, 221, 0, 0.2); }
        .tab-link.active { background: #FFDD00; color: #0033A0; }

        .player-box { margin-bottom: 25px; padding: 25px; background: #0033A0; border-radius: 15px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .track-info-container { margin-bottom: 15px; font-family: monospace; font-size: 1.1em; color: #FFDD00; }
        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 12px; background: #000; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    </style>
</head>
<body>

    <header class="hero" style="background-image: url('rooradio.jpg'); background-size: cover; background-position: center; height: 25vh; display: flex; align-items: center; justify-content: center; color: white; text-align: center;">
        <div style="background: rgba(0, 51, 160, 0.7); padding: 20px; width: 100%;">
            <h1 style="font-size: 3em; color: #FFDD00; margin: 0;">K-ROO LIVE</h1>
        </div>
    </header>

    <nav class="tab-container">
        <a href="index.html" class="tab-link active">K-ROO LIVE</a>
        <a href="archives.html" class="tab-link">WIP / ARCHIVES</a>
        <a href="about.html" class="tab-link">ABOUT & SCHEDULE</a>
        <a href="reservations.html" class="tab-link">RESERVATIONS</a>
        <a href="cafe.html" class="tab-link">THE CAFE</a>
    </nav>

    <main style="max-width: 1000px; margin: 0 auto; padding: 30px 20px;">

        <section class="player-box">
            <div class="track-info-container">
                <strong style="color: white;">[ON AIR]:</strong> <span id="track-info">Syncing...</span>
            </div>
            <audio id="audio" controls style="width: 100%; border-radius: 8px;"></audio>
        </section>

        <h2 style="color: #0033A0; border-left: 5px solid #cc0000; padding-left: 15px; margin-bottom: 15px;">VISUAL FEED</h2>
        <div class="video-wrapper">
            <iframe id="live-player" src="" frameborder="0" allowfullscreen></iframe>
        </div>

    </main>

    <script>
        // --- HLS LOGIC ---
        const streamUrl = 'https://radio.k-roo.digital/hls/k-roo_radio/live.m3u8';
        const audio = document.getElementById('audio');

        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(streamUrl);
            hls.attachMedia(audio);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                console.log("HLS Manifest loaded successfully");
            });
        } 
        // For Safari/iOS which supports HLS natively
        else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
            audio.src = streamUrl;
        }

        // --- METADATA & YOUTUBE (Existing) ---
        const CHANNEL_ID = 'UCWx5sR1VIkTLJ3BI3ZvQibQ';
        const API_KEY = 'AIzaSyDOH6T3RmKWb3MmTFZl21d-NPjvkpKp680';
        const PLAYLIST_ID = 'PL1FttfnMOMng-aI9SzkpxDvhTsgovPFAD';

        async function updateMetadata() {
            const el = document.getElementById('track-info');
            const rawUrl = 'http://164.152.16.132/api/nowplaying/k-roo_radio';
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(rawUrl)}`;
            try {
                const res = await fetch(proxyUrl);
                const data = await res.json();
                if (data?.now_playing) el.innerText = data.now_playing.song.text;
            } catch (e) { el.innerText = "K-ROO LIVE"; }
        }

        async function checkLiveStatus() {
            const player = document.getElementById('live-player');
            const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${CHANNEL_ID}&type=video&eventType=live&key=${API_KEY}`;
            try {
                const res = await fetch(url);
                const data = await res.json();
                const videoId = data.items?.[0]?.id?.videoId || null;
                player.src = videoId ? `https://www.youtube.com/embed/${videoId}?mute=1` : `https://www.youtube.com/embed/videoseries?list=${PLAYLIST_ID}&mute=1`;
            } catch (e) { player.src = `https://www.youtube.com/embed/videoseries?list=${PLAYLIST_ID}&mute=1`; }
        }

        updateMetadata();
        checkLiveStatus();
        setInterval(updateMetadata, 10000);
    </script>
</body>
</html>
