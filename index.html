<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-ROO Radio | The Voice of UMKC</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.PNG">
    <style>
        /* TAB SYSTEM */
        .tab-container { display: flex; justify-content: center; background: #0033A0; padding: 10px 0; position: sticky; top: 0; z-index: 1000; border-bottom: 2px solid #FFDD00; }
        .tab-link { color: white; padding: 12px 25px; text-decoration: none; font-weight: bold; cursor: pointer; transition: 0.3s; border-radius: 5px; margin: 0 5px; }
        .tab-link:hover { background: rgba(255, 221, 0, 0.2); }
        .tab-link.active { background: #FFDD00; color: #0033A0; }
        .tab-content { display: none; padding: 30px 20px; animation: fadeIn 0.4s; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* VIDEO STYLING */
        .show-section { margin-bottom: 50px; }
        .show-label { color: #0033A0; border-left: 5px solid #FFDD00; padding-left: 15px; margin-bottom: 15px; text-transform: uppercase; font-size: 1.4em; }
        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 12px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); background: #000; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        #schedule-container { width: 100%; overflow-x: auto; margin: 20px 0; border: 1px solid #ddd; border-radius: 8px; }
        .schedule-table { width: 100%; border-collapse: collapse; min-width: 900px; table-layout: fixed; }
        .schedule-table th, .schedule-table td { padding: 15px 10px; border: 1px solid #eee; text-align: left; vertical-align: top; font-size: 0.85em; }
        .schedule-table th { background-color: #0033A0; color: white; text-transform: uppercase; text-align: center; }
        .schedule-table td:first-child { font-weight: bold; color: #0033A0; background: #fcfcfc; width: 90px; text-align: center; }
    </style>
</head>
<body>

    <header class="hero" style="background-image: url('rooradio.jpg'); background-size: cover; background-position: center; height: 30vh; display: flex; align-items: center; justify-content: center; color: white; text-align: center;">
        <div style="background: rgba(0, 51, 160, 0.7); padding: 30px; width: 100%;">
            <h1 style="font-size: 3.5em; color: #FFDD00; margin: 0;">K-ROO</h1>
            <p style="font-size: 1.2em; letter-spacing: 2px;">THE VOICE OF UMKC</p>
        </div>
    </header>

    <nav class="tab-container">
        <div class="tab-link active" onclick="openTab(event, 'Shows')">THE K-ROO SHOW</div>
        <div class="tab-link" onclick="openTab(event, 'Live')">K-ROO LIVE</div>
        <div class="tab-link" onclick="openTab(event, 'About')">ABOUT & SCHEDULE</div>
    </nav>

    <main style="max-width: 1000px; margin: 0 auto;">

       <section id="Shows" class="tab-content active">
    
            <div class="show-section">
                <h2 class="show-label">Slated Podcasts</h2>
                <div class="video-wrapper">
                    <iframe src="https://www.youtube.com/embed/videoseries?list=PL6iSD_biiywPQKJ6-AS8adaXZsSymCl2v" data-src="https://www.youtube.com/embed/videoseries?list=PL6iSD_biiywPQKJ6-AS8adaXZsSymCl2v" frameborder="0" allowfullscreen></iframe>
                </div>
            </div>
        
            <div class="show-section">
                <h2 class="show-label">More Peak Content</h2>
                <div class="video-wrapper">
                    <iframe src="https://www.youtube.com/embed/videoseries?list=PL1FttfnMOMng-aI9SzkpxDvhTsgovPFAD" data-src="https://www.youtube.com/embed/videoseries?list=PL1FttfnMOMng-aI9SzkpxDvhTsgovPFAD" frameborder="0" allowfullscreen></iframe>
                </div>
            </div>
        
            <div class="show-section">
                <h2 class="show-label">Tweaker Tunes</h2>
                <div class="video-wrapper">
                    <iframe src="https://www.youtube.com/embed/videoseries?list=PL6iSD_biiywNa-PFdaHwVGfuMVl70z_bU" data-src="https://www.youtube.com/embed/videoseries?list=PL6iSD_biiywNa-PFdaHwVGfuMVl70z_bU" frameborder="0" allowfullscreen></iframe>
                </div>
                <p style="font-style: italic; color: #666; margin-top: 10px;">Music selection - Cloud Instance is now ONLINE.</p>
            </div>
        
        </section>

        <section id="Live" class="tab-content">
            <h2 class="show-label" style="border-left-color: #cc0000;">Live from the Booth</h2>
            <div class="video-wrapper">
                <iframe src="https://www.youtube.com/embed/39pk1otqRJc" frameborder="0" allowfullscreen></iframe>
            </div>
            <div style="margin-top: 25px; padding: 20px; background: #f0f4f8; border-radius: 15px; text-align: center;">
                <div style="margin-bottom: 15px; font-family: monospace; font-size: 1.1em; color: #0033A0;">
                    <strong>[NOW PLAYING]:</strong> <span id="track-info">Connecting to Cloud Station...</span>
                </div>
                <audio controls style="width: 100%;">
                    <source src="http://164.152.16.132:8000/live" type="audio/mpeg">
                </audio>
            </div>
        </section>

        <section id="About" class="tab-content">
            <div style="text-align: center; margin-bottom: 30px;">
                 <a href="team.html" class="tab-link" style="background: #0033A0; display: inline-block;">MEET THE CREW</a>
            </div>
            <h2 class="show-label">Weekly Schedule</h2>
            <div id="schedule-container">
                <table class="schedule-table" id="schedule-table">
                    <thead><tr><th>Loading Schedule...</th></tr></thead>
                </table>
            </div>
        </section>
    </main>

    <script>
        // --- FIXED TAB LOGIC ---
            function openTab(evt, tabName) {
                const contents = document.getElementsByClassName("tab-content");
                const links = document.getElementsByClassName("tab-link");
            
                // 1. Hide everything and "Mute" the iframes
                for (let content of contents) {
                    content.style.display = "none";
                    let iframes = content.querySelectorAll('iframe'); // Use querySelectorAll for better reach
                    iframes.forEach(f => {
                        // Save the source before clearing it
                        if (!f.getAttribute('data-src')) {
                            f.setAttribute('data-src', f.src);
                        }
                        f.src = ''; 
                    });
                }
            
                // 2. Reset the buttons
                for (let link of links) {
                    link.classList.remove("active");
                }
            
                // 3. Show the target tab and "Re-activate" ALL its videos
                const activeTab = document.getElementById(tabName);
                activeTab.style.display = "block";
                
                let activeIframes = activeTab.querySelectorAll('iframe');
                activeIframes.forEach(f => {
                    if (f.getAttribute('data-src')) {
                        f.src = f.getAttribute('data-src');
                    }
                });
            
                evt.currentTarget.classList.add("active");
            }

        // --- SMART METADATA WITH FALLBACK ---
        async function updateMetadata() {
            const el = document.getElementById('track-info');
            try {
                const res = await fetch('http://164.152.16.132/api/nowplaying/kroo');
                const data = await res.json();
                if (data?.now_playing) {
                    el.innerText = data.now_playing.song.text;
                    return;
                }
            } catch (e) { console.warn("Cloud offline, checking bridge..."); }

            try {
                const res = await fetch('https://api.npoint.io/29641e2ecc860e960df9');
                const data = await res.json();
                if (data?.track) el.innerText = data.track;
            } catch (e) { el.innerText = "K-ROO Offline"; }
        }

        // --- FIXED 6 AM SCHEDULE LOGIC ---
        async function fetchSchedule() {
            const URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTlWcfl9lN1xjw2HXKrF3b2ssyT4gVpQqqARKmi-dmiaLUcaGlauc3CiXPH2We8pnsvM0S8p03sdiXI/pub?output=csv';
            try {
                const res = await fetch(URL);
                const text = await res.text();
                const rows = text.split('\n').map(r => r.split(',').map(c => c.replace(/"/g, '')));
                
                const targetRows = rows.slice(5, 27);
                let html = '<thead><tr>';
                // Headers from index 1 to 8 (B to I)
                for (let j = 1; j <= 8; j++) html += `<th>${targetRows[0][j] || ""}</th>`;
                html += '</tr></thead><tbody>';

                for (let i = 1; i < targetRows.length; i++) {
                    html += '<tr>';
                    for (let j = 1; j <= 8; j++) {
                        let data = targetRows[i][j] || "";
                        if (j === 1) { // Force Time Calc for first column
                            let h = (5 + i) % 12 || 12;
                            let ap = (5 + i) >= 12 ? "PM" : "AM";
                            data = `${h}:00 ${ap}`;
                        }
                        html += `<td>${data || "--"}</td>`;
                    }
                    html += '</tr>';
                }
                document.getElementById('schedule-table').innerHTML = html + '</tbody>';
            } catch (e) { console.error("Schedule Error", e); }
        }

        fetchSchedule();
        updateMetadata();
        setInterval(updateMetadata, 5000);
    </script>
</body>
</html>
