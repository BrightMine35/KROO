<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>K-ROO Student Radio</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="favicon.PNG">
</head>
<body>
   <header class="hero" style="position: relative; background-image: url('rooradio.jpg'); background-size: cover; background-position: center; height: 60vh; width: 100%; overflow: hidden;">
      <div class="overlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 51, 160, 0.4); display: flex; flex-direction: column; justify-content: center; align-items: center;">
          <h1 style="margin: 0; font-size: 3.5em; color: #FFDD00; text-shadow: 2px 2px 10px rgba(0,0,0,0.7);">K-ROO Live</h1>
          <p style="color: white; font-size: 1.5em; margin-top: 10px;">The Voice of UMKC</p>
          <p style="color: #FFDD00; font-weight: bold; margin-top: 20px; background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 5px;">
             Be back February 1st 12AM, CST (10PM PST) - intermittent testing until then
          </p>
     </div>
   </header>

    <main style="max-width: 1200px; margin: 0 auto; width: 95%;">
        <section class="player" style="margin-top: 40px;">
            <h2 style="font-size: 2em; margin-bottom: 20px;">Now Streaming</h2>
        
            <div class="video-container" style="position: relative; padding-bottom: 56.25%; height: 0; max-height: 500px; overflow: hidden; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);">
               <iframe 
                    src="https://www.youtube.com/embed/mHoCIt_B9-k?autoplay=1&mute=1&live=1" 
                    style="position: absolute; top: 50%; left: 0; width: 100%; height: 180%; transform: translateY(-50%);"
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            </div>

            <p style="font-size: 0.9em; margin: 10px 0 20px; color: #6e6e6e;">
                Video visuals courtesy of <a href="https://www.youtube.com/@LofiAxol" target="_blank" style="color: #0033A0; text-decoration: none; font-weight: bold;">Lofi Axol</a>
            </p>

            <div id="metadata-bar" style="text-align: center; margin-bottom: 10px; font-family: sans-serif; padding: 15px; background: #f8f9fa; border-radius: 10px; border-left: 5px solid #0033A0;">
                <span style="font-weight: bold; color: #0033A0; letter-spacing: 1px;">NOW PLAYING:</span> 
                <span id="track-info" style="color: #333; font-style: italic; margin-left: 10px;">K-ROO Radio Station</span>
            </div>

            <div style="background: #e1e8f0; padding: 20px; border-radius: 50px; margin-top: 5px;">
                <audio controls style="width: 100%;">
                    <source src="http://10.43.30.79:8000/live" type="audio/mpeg" />
                    Your browser does not support the audio element.
                </audio>
            </div>
        </section>

        </main> 

    <footer>
        <p>© 2026 K-ROO Student Radio | University of Missouri-Kansas City</p>
    </footer>

    <script>
        function updateMetadata() {
            // Fetching from your Mac B server
            fetch('http://10.43.30.79:8000/status-json.xsl')
                .then(response => response.json())
                .then(data => {
                    let track = "K-ROO Radio Station";
                    if (data.icestats && data.icestats.source) {
                        const source = data.icestats.source;
                        // Handle cases where multiple mounts might exist
                        if (Array.isArray(source)) {
                            const liveMount = source.find(s => s.listenurl && s.listenurl.includes('/live'));
                            track = liveMount ? liveMount.title : source[0].title;
                        } else {
                            track = source.title;
                        }
                    }
                    document.getElementById('track-info').innerText = track || "K-ROO Radio Station";
                })
                .catch(err => {
                    document.getElementById('track-info').innerText = "Offline - Testing in Progress";
                });
        }
        setInterval(updateMetadata, 10000);
        updateMetadata();
    </script>
</body>
</html>
