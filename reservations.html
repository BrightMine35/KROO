<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Reservations | K-ROO Radio</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
        header { background: #0033A0; color: white; padding: 30px; text-align: center; }
        .container { max-width: 1000px; margin: 20px auto; padding: 20px; background: white; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .disclaimer { background: #fff3cd; border-left: 5px solid #ffc107; padding: 15px; margin-bottom: 20px; color: #856404; font-weight: bold; }
        .btn-reserve { display: block; width: fit-content; margin: 20px auto; padding: 15px 30px; background: #FFDD00; color: #0033A0; text-decoration: none; font-weight: bold; border-radius: 5px; text-align: center; font-size: 1.2em; transition: transform 0.2s; }
        .btn-reserve:hover { transform: scale(1.05); }
        
        #res-container { width: 100%; overflow-x: auto; }
        .schedule-table { width: 100%; border-collapse: collapse; min-width: 800px; }
        .schedule-table th, .schedule-table td { padding: 12px; border: 1px solid #ddd; text-align: center; font-size: 0.9em; }
        .schedule-table th { background: #0033A0; color: white; }
    </style>
</head>
<body>

<header>
    <h1>ROOM RESERVATIONS</h1>
    <a href="index.html" style="color:white; text-decoration:none;">← Back to Home</a>
</header>

<div class="container">
    <div class="disclaimer">
        These are office hours and room reservations, not showtimes. To reserve the radio room, click the button below to see available hours and submit a "Suggestion" on the spreadsheet.
    </div>

    <a href="YOUR_EDITABLE_SHEET_LINK_HERE" target="_blank" class="btn-reserve">APPLY FOR ROOM TIME</a>

    <div id="res-container">
        <table class="schedule-table" id="res-table">
            <thead><tr><th>Fetching Availability...</th></tr></thead>
        </table>
    </div>
</div>

<script>
    async function fetchReservations() {
        // Use your published CSV link here. 
        // TIP: If the reservations are on a different TAB, change gid=0 to the specific tab ID
        const URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTlWcfl9lN1xjw2HXKrF3b2ssyT4gVpQqqARKmi-dmiaLUcaGlauc3CiXPH2We8pnsvM0S8p03sdiXI/pub?output=csv';
        
        try {
            const res = await fetch(URL);
            const text = await res.text();
            const rows = text.split('\n').map(r => r.split(',').map(c => c.replace(/"/g, '')));
            
            // Adjust slice() based on where your reservation grid starts in the sheet
            const targetRows = rows.slice(5, 27); 
            let html = '<thead><tr>';
            for (let j = 1; j <= 8; j++) html += `<th>${targetRows[0][j] || ""}</th>`;
            html += '</tr></thead><tbody>';

            for (let i = 1; i < targetRows.length; i++) {
                html += '<tr>';
                for (let j = 1; j <= 8; j++) {
                    let data = targetRows[i][j] || "";
                    if (j === 1) { 
                        let h = (5 + i) % 12 || 12;
                        let ap = (5 + i) >= 12 ? "PM" : "AM";
                        data = `${h}:00 ${ap}`;
                    }
                    html += `<td>${data || "--"}</td>`;
                }
                html += '</tr>';
            }
            document.getElementById('res-table').innerHTML = html + '</tbody>';
        } catch (e) { console.error("Reservation Fetch Error", e); }
    }
    fetchReservations();
</script>

</body>
</html>
