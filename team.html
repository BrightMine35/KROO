<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meet the Crew | K-ROO Radio</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
        header { background: #0033A0; color: white; padding: 30px; text-align: center; }
        .team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 40px; max-width: 1200px; margin: 0 auto; }
        .dj-card { background: white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); overflow: hidden; text-align: center; padding-bottom: 20px; display: flex; flex-direction: column; }
        .dj-photo { width: 100%; height: 280px; object-fit: cover; background: #0033A0; }
        .dj-name { color: #0033A0; margin: 15px 0 5px; text-transform: uppercase; font-size: 1.4em; }
        .dj-bio { padding: 0 15px; color: #555; font-size: 0.9em; flex-grow: 1; margin-bottom: 15px; }
        .playlist-btn { display: inline-block; align-self: center; padding: 10px 20px; background: #FFDD00; color: #0033A0; text-decoration: none; font-weight: bold; border-radius: 5px; transition: transform 0.2s; }
        .playlist-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>

<header>
    <h1>MEET THE CREW</h1>
    <a href="index.html" style="color:white; text-decoration:none;">← Back to Home</a>
</header>

<div class="team-grid" id="team-container">
    <p style="text-align:center; grid-column: 1/-1;">Connecting to K-ROO database...</p>
</div>

<script>
    // 1. YOUR API CREDENTIALS
    const SHEET_ID = '1Ml20oT7hC5kmeQtZrKyWdqiLQ67JzDzkD0aeLxi-zts'; 
    const API_KEY = 'AIzaSyAguGyfJE9dOZGfVpipfe7Hwui8CYQERF8'; 
    const RANGE = 'Form Responses 1!A2:H100'; // Increased to H to include Status if needed

    // 2. SMART IMAGE FETCHER
    function fixDriveUrl(url) {
            if (!url || url.trim() === "" || url === "#") return ''; 
            url = url.trim();
        
            if (url.includes('drive.google.com')) {
                let fileId = '';
                
                // Extract ID from any Google Drive link format
                if (url.includes('/d/')) {
                    fileId = url.split('/d/')[1]?.split('/')[0];
                } else if (url.includes('id=')) {
                    fileId = url.split('id=')[1]?.split('&')[0];
                }
        
                if (fileId) {
                    // Using the Thumbnail URL with =s1000 (size 1000px) 
                    // is 10x more reliable for direct embedding than the 'uc' link.
                    return `https://lh3.googleusercontent.com/u/0/d/${fileId}=s1000`;
                }
            }
            
            // Return the original URL if it's already a direct link (Imgur/Postimages)
            return url.length > 10 ? url : '';
        }

    async function loadTeam() {
        const container = document.getElementById('team-container');
        const apiUrl = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${RANGE}?key=${API_KEY}`;
    
        try {
            const response = await fetch(apiUrl);
            const data = await response.json();
            const rows = data.values;
    
            if (!rows || rows.length === 0) {
                container.innerHTML = "<p style='text-align:center; grid-column:1/-1;'>The DJ roster is currently empty.</p>";
                return;
            }
    
            let html = '';
            rows.forEach(row => {
                const name = row[1]?.trim();     
                const bio = row[2] || "No bio provided.";       
                const imgUrl = row[3];    
                const workLink = row[6] || "#"; 
                const status = row[7]?.toLowerCase() || ""; 
            
                if (!name || name === "Name" || status.includes('inactive')) return;
            
                const fixedImg = fixDriveUrl(imgUrl);
            
                html += `
                    <div class="dj-card">
                        ${fixedImg ? `<img src="${fixedImg}" class="dj-photo" alt="${name}">` : ''}
                        <div class="dj-info">
                            <h2 class="dj-name">${name}</h2>
                            <p class="dj-bio">${bio}</p>
                            <a href="${workLink}" class="playlist-btn" target="_blank">VIEW WORK</a>
                        </div>
                    </div>`;
            });
    
            container.innerHTML = html || "<p style='text-align:center; grid-column:1/-1;'>No active DJs found.</p>";
        } catch (error) {
            console.error("Connection Error:", error);
            container.innerHTML = "<p style='text-align:center; grid-column:1/-1;'>Error connecting to station database.</p>";
        }
    }
    
    loadTeam();
</script>
</body>
</html>
