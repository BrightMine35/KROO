<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meet the Crew | K-ROO Radio</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
        header { background: #0033A0; color: white; padding: 30px; text-align: center; }
        .team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 40px; max-width: 1200px; margin: 0 auto; }
        .dj-card { background: white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); overflow: hidden; text-align: center; padding-bottom: 20px; }
        .dj-photo { width: 100%; height: 250px; object-fit: cover; }
        .dj-name { color: #0033A0; margin: 15px 0 5px; text-transform: uppercase; }
        .dj-bio { padding: 0 15px; color: #555; font-size: 0.9em; min-height: 60px; }
        .playlist-btn { display: inline-block; margin-top: 15px; padding: 10px 20px; background: #FFDD00; color: #0033A0; text-decoration: none; font-weight: bold; border-radius: 5px; }
    </style>
</head>
<body>

<header>
    <h1>MEET THE CREW</h1>
    <a href="index.html" style="color:white; text-decoration:none;">← Back</a>
</header>

<div class="team-grid" id="team-container">
    <p style="text-align:center; grid-column: 1/-1;">Loading the roster...</p>
</div>

<script>
    function fixDriveUrl(url) {
        if (!url || url.length < 10) return 'rooradio.jpg';
        if (url.includes('drive.google.com')) {
            const id = url.split('/d/')[1]?.split('/')[0] || url.split('id=')[1]?.split('&')[0];
            return `https://drive.google.com/uc?export=view&id=${id}`;
        }
        return url;
    }
        
            // UPDATED WITH YOUR CREDENTIALS
const SHEET_ID = '1Ml20oT7hC5kmeQtZrKyWdqiLQ67JzDzkD0aeLxi-zts'; 
const API_KEY = 'AIzaSyAguGyfJE9dOZGfVpipfe7Hwui8CYQERF8'; 
const RANGE = 'Form Responses 1!A2:G100'; // Change "Form Responses 1" to your tab name if different

        async function loadTeam() {
            const container = document.getElementById('team-container');
            // Using the Google Sheets API v4 URL
            const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${RANGE}?key=${API_KEY}`;
        
            try {
                const response = await fetch(url);
                const data = await response.json();
                const rows = data.values;
        
                if (!rows || rows.length === 0) {
                    container.innerHTML = "<p style='text-align:center; grid-column:1/-1;'>No crew members found in the sheet.</p>";
                    return;
                }
        
                let html = '';
                rows.forEach(row => {
                    // Mapping based on standard Google Form export:
                    // [0] Timestamp, [1] Name, [2] Bio, [3] Photo URL, [6] Work Link
                    const name = row[1];      
                    const bio = row[2] || "No bio provided.";       
                    const imgUrl = row[3];    
                    const workLink = row[6] || "#"; 
        
                    // Skip empty rows or header leftovers
                    if (!name || name === "Name" || name.includes('http')) return;
        
                    const fixedImg = fixDriveUrl(imgUrl);
        
                    html += `
                        <div class="dj-card">
                            <img src="${fixedImg}" class="dj-photo" onerror="this.src='rooradio.jpg'">
                            <div class="dj-info">
                                <h2 class="dj-name">${name}</h2>
                                <p class="dj-bio">${bio}</p>
                                <a href="${workLink}" class="playlist-btn" target="_blank">VIEW WORK</a>
                            </div>
                        </div>`;
                });
        
                container.innerHTML = html;
            } catch (error) {
                console.error("Connection Error:", error);
                container.innerHTML = "<p style='text-align:center; grid-column:1/-1;'>Error connecting to the roster. Please check API permissions.</p>";
            }
        }
        
        function fixDriveUrl(url) {
            if (!url || !url.includes('drive.google.com')) return 'rooradio.jpg';
            const id = url.split('/d/')[1]?.split('/')[0] || url.split('id=')[1]?.split('&')[0];
            return `https://drive.google.com/uc?export=view&id=${id}`;
        }
        
        loadTeam();
</script>
</body>
</html>
