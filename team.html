<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meet the Crew | K-ROO Radio</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f9f9f9; margin: 0; }
        header { background: #0033A0; color: white; padding: 40px 20px; text-align: center; }
        header h1 { color: #FFDD00; margin: 0; text-transform: uppercase; letter-spacing: 2px; }
        .back-link { color: white; text-decoration: none; font-size: 0.9em; opacity: 0.8; margin-top: 15px; display: inline-block; }
        .team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; padding: 50px 20px; max-width: 1200px; margin: 0 auto; }
        .dj-card { background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); overflow: hidden; transition: transform 0.3s ease; border: 1px solid #eee; display: flex; flex-direction: column; }
        .dj-card:hover { transform: translateY(-5px); }
        .dj-photo { width: 100%; height: 320px; object-fit: cover; background: #0033A0; }
        .dj-info { padding: 25px; flex-grow: 1; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .dj-name { color: #0033A0; font-size: 1.6em; margin: 0 0 12px 0; text-transform: uppercase; font-weight: bold; line-height: 1.2; }
        .dj-bio { color: #444; font-size: 0.95em; line-height: 1.6; margin-bottom: 20px; }
        .playlist-btn { background: #FFDD00; color: #0033A0; text-decoration: none; font-weight: bold; padding: 12px 25px; border-radius: 6px; font-size: 0.85em; transition: background 0.2s; margin-top: auto; }
        .playlist-btn:hover { background: #e6c700; }
        .loading-msg { text-align: center; grid-column: 1/-1; padding: 50px; color: #666; font-style: italic; }
    </style>
</head>
<body>

    <header>
        <h1>MEET THE CREW</h1>
        <p>The voices behind the station.</p>
        <a href="index.html" class="back-link">← Back to Radio</a>
    </header>

    <div class="team-grid" id="team-container">
        <div class="loading-msg">Connecting to the station database...</div>
    </div>

    <script>
        // 1. Bulletproof Google Drive Link Converter
        function fixDriveUrl(url) {
            if (!url || url.trim() === "" || url === "#") return 'rooradio.jpg';
            url = url.trim().replace(/"/g, '');
            if (url.includes('drive.google.com')) {
                let fileId = '';
                if (url.includes('/d/')) fileId = url.split('/d/')[1]?.split('/')[0]?.split('?')[0];
                else if (url.includes('id=')) fileId = url.split('id=')[1]?.split('&')[0];
                // Use the Universal User Content link (Best for WebP and JPG)
                if (fileId) return `https://drive.google.com/uc?export=view&id=${fileId}`;
            }
            return url;
        }

        async function loadTeam() {
            // Your specific CSV URL with your GID
            const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTUaJ9SHaOPSloQTjP-ZM9kcLpOoFXQAHdI6950BxrwJ9QB-F18cy1uETqJWMsnuDQTGwhw4p8RSNKO/pub?gid=1056346171&single=true&output=csv';
            const container = document.getElementById('team-container');

            try {
                // Add a unique timestamp to the URL to bypass Google's cache
                const response = await fetch(`${CSV_URL}&t=${Date.now()}`);
                const csvText = await response.text();
                
                // Split lines, skip the header row [0], and remove any empty lines
                const rows = csvText.split(/\r?\n/).slice(1).filter(line => line.trim() !== '');
                
                if (rows.length === 0) {
                    container.innerHTML = "<div class='loading-msg'>The DJ roster is currently empty. Check back soon!</div>";
                    return;
                }

                let finalHtml = '';
                rows.forEach(row => {
                    // This Regex splits columns by commas but IGNORES commas inside quotes (important for Bios)
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);

                    // Skip the row if there is no Name or if it's a styling artifact from Google
                    const rawName = cols[1]?.replace(/"/g, '').trim();
                    if (!rawName || rawName.toLowerCase().includes('helvetica') || rawName === '0' || rawName === 'URL') return;

                    // Check Column H [Index 7] for "Inactive"
                    const status = cols[7]?.replace(/"/g, '').trim().toLowerCase() || "";
                    if (status.includes('inactive')) return;

                    // Map the data to our variables
                    const bio = cols[2]?.replace(/"/g, '').trim() || "No bio provided.";
                    const imgUrl = fixDriveUrl(cols[3]);
                    const playlistUrl = cols[4]?.replace(/"/g, '').trim() || "#";

                    finalHtml += `
                        <div class="dj-card">
                            <img src="${imgUrl}" class="dj-photo" alt="${rawName}" onerror="this.src='rooradio.jpg'">
                            <div class="dj-info">
                                <h2 class="dj-name">${rawName}</h2>
                                <p class="dj-bio">${bio}</p>
                                <a href="${playlistUrl}" class="playlist-btn" target="_blank">LISTEN TO PLAYLIST</a>
                            </div>
                        </div>
                    `;
                });

                // Update the grid with the finished profiles
                container.innerHTML = finalHtml || "<div class='loading-msg'>No active DJs found. Check the sheet status.</div>";

            } catch (error) {
                console.error("K-ROO Logic Error:", error);
                container.innerHTML = "<div class='loading-msg'>Station database error. Please refresh the page.</div>";
            }
        }

        // Run the fetcher
        loadTeam();
    </script>

</body>
</html>
