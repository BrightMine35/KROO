<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meet the Crew | K-ROO Radio</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; padding: 40px 20px; }
        .dj-card { background: white; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; transition: 0.3s; text-align: center; border: 1px solid #eee; }
        .dj-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
        .dj-photo { width: 100%; height: 250px; object-fit: cover; background: #0033A0; }
        .dj-info { padding: 20px; }
        .dj-name { color: #0033A0; font-size: 1.5em; margin: 0 0 10px 0; text-transform: uppercase; }
        .dj-bio { color: #666; font-size: 0.9em; line-height: 1.6; min-height: 80px; }
        .playlist-btn { display: inline-block; margin-top: 15px; padding: 10px 20px; background: #FFDD00; color: #0033A0; text-decoration: none; font-weight: bold; border-radius: 5px; font-size: 0.8em; }
    </style>
</head>
<body style="background: #f9f9f9;">

    <header style="background: #0033A0; color: white; padding: 40px 20px; text-align: center;">
        <h1 style="color: #FFDD00; margin: 0;">MEET THE CREW</h1>
        <p>The voices behind the station.</p>
        <a href="index.html" style="color: white; text-decoration: none; font-size: 0.8em; opacity: 0.8;">← Back to Radio</a>
    </header>

    <div class="team-grid" id="team-container">
        <p style="text-align: center; grid-column: 1/-1;">Recruiting the talent... hang tight.</p>
    </div>

    <script>
        // 1. Helper Function (Defined outside so it's ready)
        function fixDriveUrl(url) {
            if (url && url.includes('drive.google.com')) {
                const fileId = url.split('/d/')[1]?.split('/')[0] || url.split('id=')[1]?.split('&')[0];
                return `https://lh3.googleusercontent.com/u/0/d/${fileId}`; 
            }
            return url;
        }

       async function loadTeam() {
            const CSV_URL = 'YOUR_LINK_HERE_ENDING_IN_output=csv';
            const container = document.getElementById('team-container');
        
            function fixDriveUrl(url) {
                if (!url || url === "#" || url.trim() === "") return 'rooradio.jpg';
                url = url.trim().replace(/"/g, '');
                if (url.includes('drive.google.com')) {
                    let fileId = '';
                    if (url.includes('/d/')) fileId = url.split('/d/')[1]?.split('/')[0]?.split('?')[0];
                    else if (url.includes('id=')) fileId = url.split('id=')[1]?.split('&')[0];
                    if (fileId) return `https://drive.google.com/uc?export=view&id=${fileId}`;
                }
                return url;
            }
        
            try {
                const res = await fetch(CSV_URL);
                const csvData = await res.text();
                
                // Split by lines and ignore the header
                const allRows = csvData.split(/\r?\n/).slice(1).filter(r => r.trim() !== '');
                const djMap = new Map();
        
                allRows.forEach(row => {
                    try {
                        // This new split is much more stable for Google Sheets CSVs
                        const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                        
                        if (cols && cols.length >= 2) {
                            const name = cols[1].replace(/"/g, '').trim();
                            // Skip if the status (Column H / Index 7) is Inactive
                            if (cols[7] && cols[7].toLowerCase().includes("inactive")) return;
                            
                            djMap.set(name, cols); 
                        }
                    } catch (err) { console.error("Row Error:", err); }
                });
        
                let html = '';
                djMap.forEach((cols, name) => {
                    const bio = cols[2]?.replace(/"/g, '').trim() || "No bio provided.";
                    const img = fixDriveUrl(cols[3]);
                    const playlist = cols[4]?.replace(/"/g, '').trim() || "#";
        
                    html += `
                        <div class="dj-card">
                            <img src="${img}" class="dj-photo" alt="${name}" onerror="this.src='rooradio.jpg'">
                            <div class="dj-info">
                                <h2 class="dj-name">${name}</h2>
                                <p class="dj-bio">${bio}</p>
                                <a href="${playlist}" class="playlist-btn" target="_blank">LISTEN TO PLAYLIST</a>
                            </div>
                        </div>
                    `;
                });
        
                container.innerHTML = html || "<p style='text-align:center;'>No active DJs found.</p>";
            } catch (e) {
                console.error("Critical Load Error:", e);
                container.innerHTML = "<p style='text-align:center;'>Error loading the crew. Please check your CSV link.</p>";
            }
        }
        loadTeam();
    </script>
</body>
</html>
