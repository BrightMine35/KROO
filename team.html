<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meet the Crew | K-ROO Radio</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
        header { background: #0033A0; color: white; padding: 30px; text-align: center; }
        .team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 40px; max-width: 1200px; margin: 0 auto; }
        .dj-card { background: white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); overflow: hidden; text-align: center; padding-bottom: 20px; }
        .dj-photo { width: 100%; height: 250px; object-fit: cover; }
        .dj-name { color: #0033A0; margin: 15px 0 5px; text-transform: uppercase; }
        .dj-bio { padding: 0 15px; color: #555; font-size: 0.9em; min-height: 60px; }
        .playlist-btn { display: inline-block; margin-top: 15px; padding: 10px 20px; background: #FFDD00; color: #0033A0; text-decoration: none; font-weight: bold; border-radius: 5px; }
    </style>
</head>
<body>

<header>
    <h1>MEET THE CREW</h1>
    <a href="index.html" style="color:white; text-decoration:none;">← Back</a>
</header>

<div class="team-grid" id="team-container">
    <p style="text-align:center; grid-column: 1/-1;">Loading the roster...</p>
</div>

<script>
    function fixDriveUrl(url) {
        if (!url || url.length < 10) return 'rooradio.jpg';
        if (url.includes('drive.google.com')) {
            const id = url.split('/d/')[1]?.split('/')[0] || url.split('id=')[1]?.split('&')[0];
            return `https://drive.google.com/uc?export=view&id=${id}`;
        }
        return url;
    }

    async function loadTeam() {
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTUaJ9SHaOPSloQTjP-ZM9kcLpOoFXQAHdI6950BxrwJ9QB-F18cy1uETqJWMsnuDQTGwhw4p8RSNKO/pub?gid=1056346171&single=true&output=csv';
        const container = document.getElementById('team-container');

        try {
            const res = await fetch(`${CSV_URL}&t=${Date.now()}`);
            const text = await res.text();
            const rows = text.split(/\r?\n/).slice(1); // Skip header

            let html = '';
            rows.forEach((row, i) => {
                const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                if (cols.length < 2) return;

                const name = cols[1]?.replace(/"/g, '').trim();
                const bio = cols[2]?.replace(/"/g, '').trim() || "No bio provided.";
                const img = fixDriveUrl(cols[3]?.replace(/"/g, '').trim());
                const link = cols[4]?.replace(/"/g, '').trim() || "#";
                const status = cols[7]?.toLowerCase() || "";

                // Logic: Skip if name is empty or status is inactive
                if (!name || name.toLowerCase().includes('helvetica') || status.includes('inactive')) return;

                html += `
                    <div class="dj-card">
                        <img src="${img}" class="dj-photo" onerror="this.src='rooradio.jpg'">
                        <h2 class="dj-name">${name}</h2>
                        <p class="dj-bio">${bio}</p>
                        <a href="${link}" class="playlist-btn" target="_blank">LISTEN</a>
                    </div>`;
            });

            container.innerHTML = html || "<p style='text-align:center; grid-column:1/-1;'>No active DJs found. Check Column H in the sheet!</p>";
        } catch (e) {
            container.innerHTML = "<p>Error loading data.</p>";
        }
    }
    loadTeam();
</script>
</body>
</html>
