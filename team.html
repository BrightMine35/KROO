<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meet the Crew | K-ROO Radio</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; padding: 40px 20px; }
        .dj-card { background: white; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; transition: 0.3s; text-align: center; border: 1px solid #eee; }
        .dj-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
        .dj-photo { width: 100%; height: 250px; object-fit: cover; background: #0033A0; }
        .dj-info { padding: 20px; }
        .dj-name { color: #0033A0; font-size: 1.5em; margin: 0 0 10px 0; text-transform: uppercase; }
        .dj-bio { color: #666; font-size: 0.9em; line-height: 1.6; min-height: 80px; }
        .playlist-btn { display: inline-block; margin-top: 15px; padding: 10px 20px; background: #FFDD00; color: #0033A0; text-decoration: none; font-weight: bold; border-radius: 5px; font-size: 0.8em; }
    </style>
</head>
<body style="background: #f9f9f9;">

    <header style="background: #0033A0; color: white; padding: 40px 20px; text-align: center;">
        <h1 style="color: #FFDD00; margin: 0;">MEET THE CREW</h1>
        <p>The voices behind the station.</p>
        <a href="index.html" style="color: white; text-decoration: none; font-size: 0.8em; opacity: 0.8;">← Back to Radio</a>
    </header>

    <div class="team-grid" id="team-container">
        <p style="text-align: center; grid-column: 1/-1;">Recruiting the talent... hang tight.</p>
    </div>

    <script>
        async function loadTeam() {
            // 1. YOUR PUBLISHED CSV URL HERE
            const CSV_URL = 'YOUR_PUBLISHED_CSV_URL_HERE';
            
            // 2. Helper to force Google Drive links to work as images
            function fixDriveUrl(url) {
                if (url.includes('drive.google.com')) {
                    const fileId = url.split('/d/')[1]?.split('/')[0] || url.split('id=')[1]?.split('&')[0];
                    return `https://lh3.googleusercontent.com/u/0/d/${fileId}`;
                }
                return url; // Return as-is if it's already direct (Imgur, etc.)
            }
        
            try {
                const res = await fetch(CSV_URL);
                const csvData = await res.text();
                
                // Split rows and skip header
                const rows = csvData.split('\n').slice(1).filter(r => r.trim() !== '');
        
                let html = '';
                rows.forEach(row => {
                    // Updated split to handle commas inside quotes (standard for bios)
                    const cols = row.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || row.split(',');
                    
                    // Mapping (adjust based on your Form column order)
                    const name = cols[1]?.replace(/"/g, '') || "Anonymous DJ";
                    const bio = cols[2]?.replace(/"/g, '') || "No bio provided.";
                    const img = fixDriveUrl(cols[3]?.replace(/"/g, '') || '');
                    const playlist = cols[4]?.replace(/"/g, '') || "#";
        
                    html += `
                        <div class="dj-card">
                            <img src="${img}" class="dj-photo" alt="${name}" onerror="this.src='rooradio.jpg'">
                            <div class="dj-info">
                                <h2 class="dj-name">${name}</h2>
                                <p class="dj-bio">${bio}</p>
                                <a href="${playlist}" class="playlist-btn">LISTEN TO PLAYLIST</a>
                            </div>
                        </div>
                    `;
                });
                document.getElementById('team-container').innerHTML = html;
            } catch (e) {
                console.error("Team Load Error:", e);
                document.getElementById('team-container').innerHTML = "<p>Failed to load the crew. Check the CSV link.</p>";
            }
        }
        loadTeam();
    </script>
</body>
</html>
